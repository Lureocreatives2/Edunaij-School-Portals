{% load static %}

<!DOCTYPE html>
<html lang="en">

<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>
    {% block title %} {% endblock %}
  </title>
  <!-- FONT AWESOME KIT -->
  <link rel="stylesheet" href="{% static 'vendor/fontawesome/css/all.min.css' %}">
<link rel="stylesheet" href="{% static 'vendor/fontawesome/css/v4-shims.min.css' %}">
  <!-- GOOGLE FONT -->
  <link href="https://fonts.googleapis.com/css?family=Nunito:400,700&display=swap" rel="stylesheet">

  <!-- Bootstrap css -->
  <link rel="stylesheet" href="{% static 'vendor/bootstrap/bootstrap.min.css' %}">
  <!-- SELECT 2 -->
  <link rel="stylesheet" href="{% static 'vendor/select2/select2.min.css' %}">
  <!-- Main css -->
  <link rel="stylesheet" href="{% static 'css/main.css' %}">

  {% block headrefs %}

  {% endblock headrefs %}

</head>

<body>


  <!-- SITE BODY -->
  {% block content %}
  {% endblock %}
  <!--SITE BODT END-->


  <script src="{% static 'js/vendor/jquery-3.8.0.min.js' %}"></script>
  <script src="{% static 'vendor/bootstrap/bootstrap.bundle.min.js' %}"></script>

  <script src="{% static 'vendor/select2/select2.min.js' %}"></script>
  <script>
      // Select2 for city choice
      $(document).ready(function() {
          $('#id_city').select2();
      });
  </script>

  {% block extrajs %}

  {% endblock extrajs %}

</body>

</html>
