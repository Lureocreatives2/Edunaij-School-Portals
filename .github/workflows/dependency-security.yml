name: Dependency security
on:
  push:
    paths:
      - 'requirements*.txt'
      - 'requirements/**'
      - '.github/workflows/dependency-security.yml'
  pull_request:
    paths:
      - 'requirements*.txt'
      - 'requirements/**'
      - '.github/workflows/dependency-security.yml'
  schedule:
    - cron: '20 7 * * 1'
  workflow_dispatch:
permissions:
  contents: read
jobs:
  audit:
    runs-on: ubuntu-latest
    timeout-minutes: 10
    steps:
      - uses: actions/checkout@v7
        with:
          persist-credentials: false
      - uses: actions/setup-python@v7
        with:
          python-version: '3.14'
      - run: python -m pip install pip-audit==2.10.1
      - run: python -m pip_audit -r requirements.txt --no-deps --disable-pip --progress-spinner off
